<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sibyl - Speak, and be remembered</title>
<meta name="description" content="Sibyl is a local-first, open-source voice diary for Android. Tag, transcribe and revisit your spoken thoughts, with nothing leaving your device unless you ask it to.">

<link rel="icon" type="image/png" href="assets/icon-bg-removed.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============= ICON SYMBOLS ============= -->

      <symbol id="i-palette" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.5 0 2-1 2-2s-.5-1.5-1-2 .5-2 2-2h2a4 4 0 0 0 4-4c0-5-4-8-9-8Z"/><circle cx="8" cy="10" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="7.3" r="1" fill="currentColor" stroke="none"/><circle cx="16" cy="10" r="1" fill="currentColor" stroke="none"/></symbol>

      <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/></symbol>

      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5" stroke-linecap="round"/><path d="M4 20h16" stroke-linecap="round"/></symbol>
      <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.5 14.6 9l6 .9-4.3 4.2 1 6-5.3-2.8-5.3 2.8 1-6-4.3-4.2 6-.9Z"/></symbol>
      <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5" stroke-linecap="round"/><circle cx="12" cy="8" r="0.6" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></symbol>

      <symbol id="i-linkedin" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5ZM3 9h4v12H3V9Zm7 0h3.8v1.7h.05c.53-1 1.83-2.05 3.76-2.05 4 0 4.74 2.63 4.74 6.05V21h-4v-5.4c0-1.29-.02-2.95-1.8-2.95-1.8 0-2.08 1.4-2.08 2.86V21h-4V9Z"/></symbol>
      <symbol id="i-medium" viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="6.5" cy="12" r="5.5"/><circle cx="15.5" cy="12" r="5.5"/><ellipse cx="21.5" cy="12" rx="1.6" ry="5.2"/></symbol>

      <symbol id="illus-organize" viewBox="0 0 220 150">
        <g class="illus-teal" transform="translate(30,18) rotate(-10)">
          <rect x="0" y="0" width="72" height="46" rx="10"/>
          <circle cx="15" cy="23" r="4" fill="currentColor" stroke="none"/>
        </g>
        <g class="illus-accent" transform="translate(72,58) rotate(8)">
          <rect x="0" y="0" width="80" height="50" rx="10"/>
          <circle cx="16" cy="25" r="4" fill="currentColor" stroke="none"/>
        </g>
        <g class="illus-accent" stroke-linecap="round">
          <path d="M150 28 L192 70"/>
          <path d="M183 61 L197 75 L189 83 Z" fill="currentColor" stroke="none"/>
        </g>
        <g class="illus-teal" stroke-linecap="round">
          <path d="M40 122 H140"/>
          <path d="M40 134 H108"/>
        </g>
      </symbol>

      <symbol id="illus-transcribe" viewBox="0 0 220 150">
        <g class="illus-teal" stroke-linecap="round">
          <path d="M20 100 V60"/>
          <path d="M35 110 V40"/>
          <path d="M50 100 V70"/>
          <path d="M65 112 V50"/>
          <path d="M80 100 V65"/>
        </g>
        <g class="illus-accent" stroke-linecap="round">
          <path d="M98 76 H118"/>
          <path d="M112 68 L124 76 L112 84"/>
        </g>
        <g class="illus-accent" stroke-linecap="round">
          <path d="M144 42 H206"/>
          <path d="M144 64 H196"/>
          <path d="M144 86 H206"/>
          <path d="M144 108 H170"/>

</svg>

<header class="site-header" id="siteHeader">
  <div class="wrap header-row">
    <a href="#top" class="brand">
      <span class="brand-logo"><span class="logo-anim logo-sm" aria-hidden="true">
  <span class="logo-disc"></span>
  <img class="logo-layer logo-hair" src="assets/logo/hair.png" alt="">
  <img class="logo-layer logo-base" src="assets/logo/base.png" alt="">
  <img class="logo-layer logo-leaf" src="assets/logo/leaf.png" alt="">
  <span class="logo-shine"></span>
</span><img class="brand-text" src="assets/logo/sibyl-text.png" alt="Sibyl"></span>
    </a>
    <nav class="chapter-nav" id="chapterNav" aria-label="Sections"></nav>
    <div class="header-actions">
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle light and dark theme">
        <svg class="icon icon-sun"><use href="#i-sun"/></svg>
        <svg class="icon icon-moon"><use href="#i-moon"/></svg>
      </button>
      <a class="btn btn-ghost header-cta btn-row" id="headerCta" href="#" target="_blank" rel="noopener"></a>
      <button class="nav-toggle" id="navToggle" aria-label="Open menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<main id="top">

  <!-- ================= HERO ================= -->
  <section class="chapter hero" id="overview">
    <div class="hero-glow" aria-hidden="true"></div>
    <div class="wrap hero-grid">
      <div class="hero-copy">
        <div class="hero-mark"><span class="logo-anim logo-lg" aria-hidden="true">
  <span class="logo-disc"></span>
  <img class="logo-layer logo-hair" src="assets/logo/hair.png" alt="">
  <img class="logo-layer logo-base" src="assets/logo/base.png" alt="">
  <img class="logo-layer logo-leaf" src="assets/logo/leaf.png" alt="">
  <span class="logo-shine"></span>
</span></div>
        <p class="hero-tagline" id="heroTagline"></p>
        <h1 class="hero-headline" id="heroHeadline"></h1>
        <p class="hero-lede" id="heroLede"></p>
        <div class="hero-actions">
          <a href="#" class="btn btn-primary" id="heroPrimaryCta">
            <span class="btn-label"></span>
            <span class="btn-sub"></span>
          </a>
          <a href="#" class="btn btn-outline" id="heroSecondaryCta"></a>
        </div>
      </div>
      <div class="hero-phone-wrap">
        <div class="phone" id="heroPhone">
          <div class="phone-screen" id="heroPhoneScreen"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ================= PILLAR STRIP ================= -->
  <section class="pillars">
    <div class="wrap pillars-grid" id="pillarsGrid"></div>
  </section>

  <!-- ================= DIFFERENCE ================= -->
  <section class="chapter difference" id="difference">
    <div class="wrap">
      <span class="orbit-eyebrow-pill">Why Sibyl?</span>
      <h2 class="chapter-heading" id="diffHeading"></h2>
      <p class="chapter-intro" id="diffIntro"></p>

      <!-- desktop: large sticky phone on the left, a curved card conveyor on the right -->
      <div class="orbit-stage-outer" id="orbitStageOuter">
        <div class="orbit-stage">
          <div class="orbit-phone">
            <div class="phone phone-big" id="orbitPhone">
              <div class="phone-screen" id="orbitPhoneScreen"></div>
            </div>
          </div>
          <div class="orbit-arc-stage" id="orbitArcStage"></div>
        </div>
      </div>

      <!-- mobile/tablet: static phone, cards swipe horizontally beneath it -->
      <div class="orbit-mobile" id="orbitMobile">
        <div class="orbit-mobile-phone">
          <div class="phone phone-mobile">
            <div class="phone-screen" id="orbitMobilePhoneScreen"></div>
          </div>
        </div>
        <div class="orbit-mobile-track" id="orbitMobileTrack"></div>
        <div class="orbit-mobile-dots" id="orbitMobileDots"></div>
      </div>
    </div>
  </section>

  <!-- ================= FEATURES ================= -->
  <section class="chapter features" id="features">
    <div class="wrap">
      <p class="section-eyebrow">Inside the app</p>
      <h2 class="chapter-heading" id="featuresHeading"></h2>
      <p class="chapter-intro" id="featuresIntro"></p>
      <div class="bento" id="bentoGrid"></div>
    </div>
  </section>

  <!-- ================= PRIVACY ================= -->
  <section class="chapter vow" id="privacy">
    <div class="wrap">
      <div class="vow-panel">
        <div class="vow-panel-glow" aria-hidden="true"></div>
        <div class="vow-stack">
          <div class="vow-head reveal">
            <p class="section-eyebrow">Privacy</p>
            <h2 class="chapter-heading" id="vowHeading"></h2>
            <p class="chapter-intro" id="vowIntro"></p>
            <blockquote class="vow-quote" id="vowQuote"></blockquote>
          </div>

          <div class="flow-diagram reveal" id="flowDiagram">
            <div class="flow-node flow-device">
              <svg class="icon"><use href="#i-shield"/></svg>
              <strong id="flowDeviceLabel"></strong>
              <span id="flowDeviceNote"></span>
            </div>
            <div class="flow-branches">
              <div class="flow-branch">
                <div class="flow-line flow-line-blocked"><span class="flow-x">&#10005;</span></div>
                <div class="flow-node flow-cloud">
                  <svg class="icon"><use href="#i-eyeOff"/></svg>
                  <strong id="flowCloudLabel"></strong>
                  <span id="flowCloudNote"></span>
                </div>
              </div>
              <div class="flow-branch">
                <div class="flow-line flow-line-dashed"></div>
                <div class="flow-node flow-groq">
                  <svg class="icon"><use href="#i-key"/></svg>
                  <strong id="flowGroqLabel"></strong>
                  <span id="flowGroqNote"></span>
                </div>
              </div>
            </div>
          </div>

          <ul class="vow-points reveal" id="vowPoints"></ul>
        </div>
      </div>
    </div>
  </section>

  <!-- ================= DOWNLOAD ================= -->
  <section class="chapter get" id="download">
    <div class="wrap">
      <div class="get-card">
        <div class="get-card-glow" aria-hidden="true"></div>
        <p class="section-eyebrow">Get Sibyl</p>
        <h2 class="chapter-heading" id="getHeading"></h2>
        <p class="chapter-intro" id="getIntro"></p>
        <div class="get-cta-row">
          <a href="#" class="btn btn-primary btn-large btn-shine" id="getPrimaryCta">
            <span class="btn-label"></span>
            <span class="btn-sub"></span>
          </a>
          <a href="#" class="btn btn-outline btn-row btn-large" id="getStarCta" target="_blank" rel="noopener"></a>
        </div>
        <div class="get-badges" id="getBadges"></div>
        <div class="get-steps" id="getSteps"></div>
        <ul class="get-links" id="getLinks"></ul>
      </div>
    </div>
  </section>

  <!-- ================= CREATOR ================= -->
  <section class="chapter creator" id="creator">
    <div class="wrap"><div class="creator-card">
      <div class="creator-avatar" id="creatorAvatar"></div>
      <div class="creator-copy">
        <p class="section-eyebrow" id="creatorHeading"></p>
        <h3 id="creatorName"></h3>
        <p id="creatorTagline"></p>
        <div class="creator-links" id="creatorLinks"></div>
      </div>
    </div>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="wrap footer-row">
    <div>
      <p class="footer-line1" id="footerLine1"></p>
      <p class="footer-line2" id="footerLine2"></p>
    </div>
    <ul class="footer-links" id="footerLinks"></ul>
  </div>
</footer>

<div class="lightbox" id="lightbox" aria-hidden="true">
  <button class="lightbox-close" id="lightboxClose" aria-label="Close">&times;</button>
  <img id="lightboxImg" alt="">
  <p id="lightboxCaption"></p>
</div>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
